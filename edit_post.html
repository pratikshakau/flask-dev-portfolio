{% extends "base.html" %}

{% block content %}
<h2>Edit post ✏️</h2>
<form method="POST" class="mt-3">
    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text"
               name="title"
               class="form-control"
               value="{{ post.title }}"
               required>
    </div>
    <div class="mb-3">
        <label class="form-label">Content</label>
        <textarea name="content" rows="7" class="form-control" required>{{ post.content }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save changes</button>
    <a href="{{ url_for('post_detail', post_id=post.id) }}" class="btn btn-secondary ms-2">Cancel</a>
</form>
{% endblock %}
