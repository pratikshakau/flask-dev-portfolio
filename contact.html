{% extends "base.html" %}

{% block content %}
<h2>Contact Me 💌</h2>
<p>
    Want to connect about data, projects, or opportunities?  
    Fill out this form or reach out on LinkedIn.
</p>

<form method="POST" class="mt-3">
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea name="message" rows="5" class="form-control" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Send</button>
</form>

<hr class="my-4">

<h5>Or connect here 🌐</h5>
<ul>
    <li>LinkedIn: <a href="https://linkedin.com/in/pratiksha-kaushik-766238212" target="_blank">
        linkedin.com/in/pratiksha-kaushik-766238212</a></li>
    <li>Email: <a href="mailto:krithinpratiksha@gmail.com">krithinpratiksha@gmail.com</a></li>
</ul>
{% endblock %}
